# Configuración de base de datos CrediActiva
# Base de datos: crediactiva
# Usuario: root
# Contraseña: root

# Configuración de conexión
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/crediactiva?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
db.username=root
db.password=root

# Configuración del pool de conexiones HikariCP
db.pool.minimumIdle=5
db.pool.maximumPoolSize=20
db.pool.idleTimeout=300000
db.pool.maxLifetime=1200000
db.pool.connectionTimeout=20000

# Configuración de logging
logging.level.pe.crediactiva=INFO
logging.level.com.zaxxer.hikari=WARN
